[workspace]
resolver = "2"
members = [
    "lib",
    "skyland-daemon",
    "skyland-web",
    "skyland-app",
    "tests",
]

[workspace.package]
version = "0.19.11"
edition = "2021"
authors = ["Skyland团队"]

[workspace.dependencies]
# gRPC / Protobuf
tonic = "0.8"
prost = "0.11"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.5"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (for LLM API)
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }

# Web framework
axum = "0.6"
tower-http = { version = "0.4", features = ["cors", "fs"] }

# Embedded static assets (单文件绿色部署 — 前端编译期嵌入二进制)
rust-embed = "8"
mime_guess = "2"

# File watching
notify = "5.0"

# Regex
regex = "1"
docx-rs = "0.4"
rust_xlsxwriter = "0.79"
genpdf = "0.2"
zip = "2"


# Glob pattern matching
glob = "0.3"

# Auth (password hashing + random tokens)
argon2 = "0.5"
rand = "0.8"

# Native fatal-error dialog (desktop app has no console)
rfd = "0.16"

# Internal crates
skyland-lib = { path = "lib" }
skyland-daemon = { path = "skyland-daemon" }

# Dev dependencies
tempfile = "3"
assert_cmd = "2"
predicates = "2"
