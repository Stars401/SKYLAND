syntax = "proto3";

package skyland;

// 健康检查
message HealthCheckRequest {}
message HealthCheckResponse {
    string status = 1;
    string version = 2;
}

// 任务看板
message TaskInfo {
    string id = 1;
    string description = 2;
    string assignee = 3;
    string status = 4;
}

message GetTaskBoardRequest {}
message GetTaskBoardResponse {
    repeated TaskInfo tasks = 1;
}

// 智能体状态
message AgentStatusRequest {}
message AgentStatusResponse {
    string agent_name = 1;
    string status = 2;
    int32 task_count = 3;
}

service SkylandService {
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
    rpc GetTaskBoard(GetTaskBoardRequest) returns (GetTaskBoardResponse);
    rpc GetAgentStatus(AgentStatusRequest) returns (AgentStatusResponse);
}
